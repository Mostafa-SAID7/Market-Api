name: .NET Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults --collect:"XPlat Code Coverage"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: ./TestResults
        if-no-files-found: error

    - name: Upload code coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage
        path: '**/coverage.cobertura.xml'
        if-no-files-found: warn

    
    - name: Publish
      run: dotnet publish src/Market.API/Market.API.csproj --no-restore --configuration Release --output ./publish
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: market-api
        path: ./publish
