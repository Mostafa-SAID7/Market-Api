version: '3.8'

services:
  # SQL Server database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: market-api-mssql
    restart: always
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourPassword@123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - market-api-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "YourPassword@123" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Market API Application
  market-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-api
    restart: always
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=MarketDb;User Id=sa;Password=YourPassword@123;Encrypt=False;TrustServerCertificate=True;
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - market-api-network

volumes:
  mssql_data:

networks:
  market-api-network:
    driver: bridge
